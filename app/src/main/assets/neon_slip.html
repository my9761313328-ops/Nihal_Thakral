<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gendistan</title>
<style>
:root{--bg:#0f1230;--fg:#e8f6ff;--accent:#7dd3fc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;pointer-events:none}
#hud small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.55}
#hud b{font-size:26px;text-shadow:0 0 10px rgba(125,211,252,.45)}
#hint{position:fixed;left:0;right:0;top:50%;bottom:0;padding:0 20px calc(env(safe-area-inset-bottom,0px) + 24px);box-sizing:border-box;text-align:center;pointer-events:none;font-size:15px;text-shadow:0 0 10px var(--accent)}
#hint .hw{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
#hint .cap{position:relative;width:250px;height:64px;margin-bottom:46px;border-radius:32px;border:2px solid rgba(125,211,252,.5);background:rgba(125,211,252,.1);box-shadow:0 0 18px rgba(125,211,252,.2)}
#hint .cap::before,#hint .cap::after{position:absolute;top:50%;font-size:34px;line-height:1;opacity:.5;transform:translateY(-54%)}
#hint .cap::before{content:"\2039";left:16px}
#hint .cap::after{content:"\203A";right:16px}
#hint .fg{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0,rgba(125,211,252,.55) 60%,transparent 70%)}
#hint .fg::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(125,211,252,.9);animation:fgP 1s ease-out infinite}
#hint .fg::after{content:"";position:absolute;left:50%;top:16px;width:20px;height:46px;margin-left:-10px;border-radius:10px 10px 8px 8px;background:linear-gradient(#fff,#bfe3f6);box-shadow:0 4px 10px rgba(0,0,0,.35);transform:rotate(-12deg)}
#hint span{display:block;opacity:.85}
@keyframes fgP{from{transform:scale(.7);opacity:1}to{transform:scale(1.7);opacity:0}}
#pop{position:fixed;left:0;right:0;top:0;height:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:30px;letter-spacing:.02em;pointer-events:none;opacity:0;color:#fff;text-shadow:0 0 14px rgba(125,211,252,.7),0 0 30px rgba(255,107,138,.5)}
#pop.show{animation:pop 1.1s ease-out forwards}
#pop.big{font-size:40px;color:#fbbf24}
#mt{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);z-index:5;width:40px;height:40px;padding:0;border-radius:50%;border:1px solid rgba(125,211,252,.45);background:rgba(125,211,252,.12);color:#fff;font-size:18px;line-height:1;cursor:pointer;box-shadow:0 0 12px rgba(125,211,252,.25)}
@keyframes pop{0%{opacity:0;transform:translateY(-14px) scale(.6)}15%{opacity:1;transform:translateY(0) scale(1.18)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-10px) scale(1)}}
#ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#0f1230e6;text-align:center;gap:6px}
#ov h1{margin:0;font-size:38px;text-shadow:0 0 18px rgba(255,107,138,.6)}
#ov p{margin:0 0 14px;opacity:.8}
#ov button{font:inherit;font-weight:700;font-size:18px;padding:14px 38px;border:0;border-radius:30px;background:var(--accent);color:#021218;cursor:pointer;box-shadow:0 0 22px var(--accent)}
#ov button:disabled{opacity:.5;cursor:default}
#ov button.ad-loading:disabled{opacity:.9}
#mc{position:relative;width:130px;height:150px;margin-bottom:8px}
#mc .sh{position:absolute;left:50%;bottom:0;width:76px;height:12px;margin-left:-38px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(3px)}
#mc .bd{position:absolute;left:50%;bottom:14px;width:88px;height:88px;margin-left:-44px;border-radius:50%;transform-origin:50% 100%;background:radial-gradient(circle at 32% 28%,#fff 0,#c9eeff 16%,#7dd3fc 48%,#2b7fb8 84%,#1b4d78 100%);box-shadow:inset -9px -11px 20px rgba(8,26,64,.55),0 0 30px rgba(125,211,252,.4)}
#mc i{position:absolute;display:block}
#mc .ar{top:50px;width:14px;height:36px;border-radius:8px;transform-origin:50% 6px;background:linear-gradient(90deg,#c9eeff,#4aa3d6);box-shadow:inset -3px -3px 6px rgba(8,26,64,.4)}
#mc .al{left:-10px}
#mc .arr{right:-10px}
#mc .ey{top:30px;width:12px;height:17px;border-radius:50%;background:#10203f}
#mc .ey::after{content:"";position:absolute;left:3px;top:3px;width:4px;height:5px;border-radius:50%;background:#fff}
#mc .el{left:23px}
#mc .er{right:23px}
#mc .mo{left:50%;top:54px;width:28px;height:15px;margin-left:-14px;border-radius:0 0 28px 28px/0 0 15px 15px;background:#4a1223}
#mc .tg{left:50%;top:62px;width:14px;height:10px;margin-left:-7px;border-radius:0 0 10px 10px;background:#ff7a96;display:none}
#mc.mock .bd{animation:burst 2.2s ease-out infinite;transform-origin:50% 50%}
#mc.mock .sh,#mc.mock .bd i{display:none}
#mc.mock::before,#mc.mock::after{content:"";position:absolute;left:55px;top:82px;width:20px;height:20px;box-sizing:border-box;border-radius:50%;border:3px solid #ff6b8a;box-shadow:0 0 14px rgba(255,107,138,.6);opacity:0;animation:ring 2.2s ease-out infinite}
#mc.mock::after{border-color:#fbbf24;box-shadow:0 0 14px rgba(251,191,36,.6);animation-delay:.14s}
#mc.win .bd{animation:jump .8s ease-in-out infinite}
#mc.win .sh{animation:shj .8s ease-in-out infinite}
#mc.win .al{animation:upL .4s ease-in-out infinite alternate}
#mc.win .arr{animation:upR .4s ease-in-out infinite alternate}
#mc.win::before{content:"\1F389";position:absolute;top:-6px;right:-18px;font-size:28px;animation:tw .4s ease-in-out infinite alternate}
#mc.win::after{content:"\2728";position:absolute;top:6px;left:-18px;font-size:24px;animation:tw .5s ease-in-out infinite alternate}
@keyframes burst{0%{transform:scale(1);opacity:1}10%{transform:translateX(-3px) scale(1.04)}16%{transform:translateX(3px) scale(1.08)}22%{transform:translateX(-3px) scale(1.12)}30%{transform:scale(1.35);opacity:1}40%{transform:scale(1.6);opacity:0}78%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes ring{0%,30%{transform:scale(.3);opacity:0}32%{opacity:.9}100%{transform:scale(7);opacity:0}}
@keyframes flapL{from{transform:rotate(15deg)}to{transform:rotate(55deg)}}
@keyframes flapR{from{transform:rotate(-15deg)}to{transform:rotate(-55deg)}}
@keyframes upL{from{transform:rotate(135deg)}to{transform:rotate(168deg)}}
@keyframes upR{from{transform:rotate(-135deg)}to{transform:rotate(-168deg)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1.1,.88)}25%,75%{transform:translateY(-30px) scale(.95,1.08)}50%{transform:translateY(-50px) scale(.95,1.06)}}
@keyframes shj{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(.55);opacity:.2}}
@keyframes tw{from{transform:scale(.85) rotate(-6deg)}to{transform:scale(1.15) rotate(8deg)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
<div><small>Score</small><b id="sc">0</b></div>
<div style="text-align:right"><small>Best</small><b id="bs">0</b></div>
</div>
<div id="pop"></div>
<button id="mt" aria-label="Sound"></button>
<div id="hint"><div class="hw"><div class="cap"><i class="fg" id="fg"></i></div><span>Hold your Finger to Start Game</span></div></div>
<div id="ov"><div id="mc" class="mock"><div class="sh"></div><div class="bd"><i class="ar al"></i><i class="ar arr"></i><i class="ey el"></i><i class="ey er"></i><i class="mo"></i><i class="tg"></i></div></div><h1 id="ot">CRASH!</h1><p id="od"></p><button id="ob">Try Again</button></div>
<script>
const cv=document.getElementById('c');
const g=cv.getContext('2d',{alpha:false});
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1,tw=360,bgGrad=null,visR=900,gateSpr=null;
const TL=14,tqx=new Float32Array(TL),tqy=new Float32Array(TL),BE=[0,0,0,0],GM=10,fgEl=document.getElementById('fg');
let tn=0,th=0;
const TRC=Array.from({length:TL},(_,j)=>'rgba(125,211,252,'+(j/TL*0.35)+')');
const gsp=document.createElement('canvas');
gsp.width=96;gsp.height=96;
{
const gc=gsp.getContext('2d');
const rg=gc.createRadialGradient(48,48,4,48,48,46);
rg.addColorStop(0,'rgba(125,211,252,.55)');
rg.addColorStop(0.4,'rgba(125,211,252,.22)');
rg.addColorStop(1,'rgba(125,211,252,0)');
gc.fillStyle=rg;
gc.fillRect(0,0,96,96);
}
let state='ready',time=0,theta=0,target=0,shake=0,best=0;
let bx=0,by=0,vx=0,vy=0,nextY=0;
let obs=[],parts=[],trail=[];
const BR=10,BARY=30,GTH=14;
let gateOpen=0,gateGo=false,lastSc=-1;
try{best=parseInt(localStorage.getItem('ns_best2'))||0}catch(e){}
$('bs').textContent=best;

function resize(){
dpr=Math.min(window.devicePixelRatio||1,1.5);
W=innerWidth;H=innerHeight;
cv.width=W*dpr;cv.height=H*dpr;
g.setTransform(dpr,0,0,dpr,0,0);
bgGrad=g.createLinearGradient(0,0,W,H);
bgGrad.addColorStop(0,'#1a1650');
bgGrad.addColorStop(1,'#0b0d26');
tw=Math.max(260,Math.min(W*0.86,420));
visR=Math.hypot(W/2,H*0.62)+60;
gateSpr=null;
}
addEventListener('resize',resize);
resize();

let ac=null,mg=null,mus=null,sfx=null,mflt=null,arpBus=null,nbuf=null,muted=false,musicOn=false,mTimer=0,mStep=0,mNext=0;
try{muted=localStorage.getItem('ns_mute')==='1'}catch(e){}
const BPM=118,SD=60/BPM/4;
const mtof=m=>440*Math.pow(2,(m-69)/12);
const BASS=[45,41,48,43];
const ARP=[[57,60,64,69],[57,60,65,69],[60,64,67,72],[55,59,62,67]];
const PAD=[[57,60,64],[53,57,60],[55,60,64],[55,59,62]];
const PEN=[0,2,4,7,9,12,14,16];

function initAudio(){
if(ac)return;
try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null;return}
const comp=ac.createDynamicsCompressor();
comp.threshold.value=-16;comp.ratio.value=4;comp.attack.value=0.003;comp.release.value=0.2;
mg=ac.createGain();mg.gain.value=muted?0:0.9;
mg.connect(comp);comp.connect(ac.destination);
mflt=ac.createBiquadFilter();mflt.type='lowpass';mflt.frequency.value=1800;mflt.Q.value=1.2;
mus=ac.createGain();mus.gain.value=0.5;
mus.connect(mflt);mflt.connect(mg);
sfx=ac.createGain();sfx.gain.value=1;sfx.connect(mg);
arpBus=ac.createGain();arpBus.gain.value=1;arpBus.connect(mus);
const dl=ac.createDelay(1),fb=ac.createGain();
dl.delayTime.value=SD*3;fb.gain.value=0.35;
arpBus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(mus);
nbuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);
const d=nbuf.getChannelData(0);
for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}

function tone(f,d,type,v,dest,t0,sl){
if(!ac)return;
const t=t0||ac.currentTime;
const o=ac.createOscillator(),gn=ac.createGain();
o.type=type||'sine';
o.frequency.setValueAtTime(f,t);
o.frequency.exponentialRampToValueAtTime(Math.max(f*(sl||0.4),30),t+d);
gn.gain.setValueAtTime(0.0001,t);
gn.gain.linearRampToValueAtTime(v||0.12,t+0.006);
gn.gain.exponentialRampToValueAtTime(0.0008,t+d);
o.connect(gn);gn.connect(dest||sfx);
o.start(t);o.stop(t+d+0.03);
}
function noise(d,v,type,fr,dest,t0,fr2){
if(!ac)return;
const t=t0||ac.currentTime;
const s=ac.createBufferSource();s.buffer=nbuf;
const f=ac.createBiquadFilter();f.type=type;
f.frequency.setValueAtTime(fr,t);
if(fr2)f.frequency.exponentialRampToValueAtTime(fr2,t+d);
const gn=ac.createGain();
gn.gain.setValueAtTime(v,t);
gn.gain.exponentialRampToValueAtTime(0.0008,t+d);
s.connect(f);f.connect(gn);gn.connect(dest||sfx);
s.start(t,Math.random()*0.5);s.stop(t+d+0.03);
}

function schedStep(i,t){
const s=i%16,bar=Math.floor(i/16)%4;
const lv=by>4500?2:by>1400?1:0;
mflt.frequency.setTargetAtTime(lv===0?1800:lv===1?3800:8000,t,0.4);
if(s%4===0){
tone(150,0.22,'sine',0.85,mus,t,0.28);
noise(0.02,0.18,'highpass',3000,mus,t);
}
if(s===4||s===12){
noise(0.15,0.32,'bandpass',2200,mus,t);
tone(210,0.1,'triangle',0.22,mus,t,0.6);
}
if(s%4===2||(lv>=1&&s%2===0)||(lv>=2&&s%2===1)){
const op=s===14&&lv>=1;
noise(op?0.16:0.04,(lv>=2&&s%2===1)?0.07:0.12,'highpass',7500,mus,t);
}
if(s===0||s===3||s===6||s===8||s===11||s===14){
const m=BASS[bar]+((s===6||s===14)?12:0),f=mtof(m);
tone(f,SD*2.4,'sawtooth',0.2,mus,t,1);
tone(f,SD*2.6,'sine',0.3,mus,t,1);
}
if(lv>=1||s%2===0){
const n=ARP[bar][[0,1,2,3,2,1,3,2][s%8]]+((lv>=1&&s>=8)?12:0);
tone(mtof(n),SD*1.1,'square',lv>=2?0.05:0.04,arpBus,t,1);
}
if(s===0){
for(const n of PAD[bar])tone(mtof(n),SD*8,'triangle',0.05,mus,t,1);
}
}
function startMusic(){
if(!ac||musicOn)return;
musicOn=true;mStep=0;mNext=ac.currentTime+0.06;
const t=ac.currentTime;
mus.gain.cancelScheduledValues(t);
mus.gain.setValueAtTime(0.0001,t);
mus.gain.linearRampToValueAtTime(0.5,t+0.4);
mflt.frequency.value=1200;
mTimer=setInterval(()=>{
while(mNext<ac.currentTime+0.15){schedStep(mStep,mNext);mNext+=SD;mStep++}
},25);
}
function stopMusic(){
if(!ac||!musicOn)return;
musicOn=false;clearInterval(mTimer);
const t=ac.currentTime;
mus.gain.cancelScheduledValues(t);
mus.gain.setValueAtTime(Math.max(mus.gain.value,0.001),t);
mus.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
}

function sfxClick(){if(!ac)return;tone(660,0.08,'triangle',0.1,sfx,0,1.5)}
function sfxStart(){
if(!ac)return;const t=ac.currentTime;
tone(180,0.45,'sawtooth',0.07,sfx,t,5);
noise(0.45,0.14,'bandpass',500,sfx,t,5000);
tone(80,0.5,'sine',0.5,sfx,t+0.08,0.4);
}
function sfxPerfect(n){
if(!ac)return;const t=ac.currentTime;
const b=72+PEN[n%8];
tone(mtof(b),0.14,'triangle',0.12,sfx,t,1);
tone(mtof(b+12),0.22,'sine',0.07,sfx,t+0.07,1);
}
function sfxCrazy(){
if(!ac)return;const t=ac.currentTime;
[79,84,91].forEach((m,i)=>tone(mtof(m),0.14,'square',0.07,sfx,t+i*0.05,1));
noise(0.3,0.14,'bandpass',800,sfx,t,4500);
}
function sfxStreak(){
if(!ac)return;const t=ac.currentTime;
[72,76,79,84].forEach(m=>tone(mtof(m),0.5,'triangle',0.1,sfx,t,1));
tone(mtof(96),0.4,'sine',0.07,sfx,t+0.1,1);
noise(0.35,0.1,'highpass',6000,sfx,t);
}
function sfxChime(){
if(!ac)return;const t=ac.currentTime;
[84,88,91,96].forEach((m,i)=>tone(mtof(m),0.3,'sine',0.09,sfx,t+i*0.07,1));
}
function sfxCrash(){
if(!ac)return;const t=ac.currentTime;
noise(0.75,0.5,'lowpass',3500,sfx,t,120);
noise(0.25,0.25,'highpass',5000,sfx,t);
tone(130,0.75,'sine',0.7,sfx,t,0.25);
tone(95,0.5,'sawtooth',0.22,sfx,t,0.3);
}
function sfxWin(){
if(!ac)return;const t=ac.currentTime+0.02;
[72,76,79,84,88,91].forEach((m,i)=>{
tone(mtof(m),0.22,'triangle',0.12,sfx,t+i*0.085,1);
tone(mtof(m+12),0.18,'square',0.04,sfx,t+i*0.085,1);
});
[72,76,79,84].forEach(m=>tone(mtof(m),0.9,'triangle',0.1,sfx,t+0.55,1));
noise(0.6,0.1,'highpass',7000,sfx,t+0.55);
}
function sfxLose(){
if(!ac)return;const t=ac.currentTime+0.02;
[67,64,60,55].forEach((m,i)=>tone(mtof(m),0.25,'triangle',0.1,sfx,t+i*0.13,0.9));
}
const mt=$('mt');
function paintMute(){mt.textContent=muted?'\u{1F507}':'\u{1F50A}'}
paintMute();
mt.onclick=()=>{
muted=!muted;paintMute();
try{localStorage.setItem('ns_mute',muted?'1':'0')}catch(e){}
if(mg)mg.gain.setTargetAtTime(muted?0:0.9,ac.currentTime,0.05);
};
document.addEventListener('visibilitychange',()=>{
if(!ac)return;
if(document.hidden)ac.suspend();else ac.resume();
});

function reset(){
stopMusic();score=0;obs=[];parts=[];tn=0;th=0;streak=0;startBest=best;hsShown=false;gateOpen=0;gateGo=false;lastSc=-1;$('pop').className='';
bx=tw/2;by=0;vx=0;vy=0;theta=0;target=0;time=0;
nextY=520;
state='ready';
$('ov').style.display='none';
$('hint').style.display='block';
$('sc').textContent=0;
fill();
}

function rnd(a,b){return a+Math.random()*(b-a)}

function spawn(){
const d=Math.min(by/9000,1);
const r=Math.random();
const y=nextY;
if(r<0.3){
const gw=Math.max(96,160-60*d);
const amp=Math.random()<0.55?(tw-gw)/2*0.75*(0.35+0.65*d):0;
obs.push({t:'wall',y,gw,th:16,amp,sp:rnd(0.8,1.6)*(0.7+d*0.6),ph:rnd(0,6.28),h:16});
nextY+=rnd(300,360);
}else if(r<0.55){
const len=tw*(0.46+0.14*d);
const cross=d>0.25&&Math.random()<0.5;
const sp=(Math.random()<0.5?-1:1)*(0.7+0.9*d);
obs.push({t:'bar',cx:tw/2+rnd(-0.1,0.1)*tw,cy:y+len*0.6,len,a0:rnd(0,6.28),sp,cross,y,h:len*1.2});
nextY+=len*1.25+rnd(110,160);
}else if(r<0.78){
const len=tw*(0.55+0.08*d);
const side=Math.random()<0.5?0:1;
obs.push({t:'laser',y,len,side,per:rnd(2.2,3),on:rnd(1,1.5),ph:rnd(0,3),h:8});
nextY+=rnd(220,270);
}else{
const n=3;
const amp=tw*0.28;
for(let i=0;i<n;i++){
obs.push({t:'orb',y:y+i*70,cx:tw/2+(i-1)*tw*0.16,amp,sp:rnd(0.9,1.5)*(0.8+d*0.5),ph:rnd(0,6.28),r:rnd(13,19),h:30,gid:y,last:i===n-1});
}
nextY+=n*70+rnd(150,200);
}
}

function fill(){
while(nextY<by+Math.max(H,W)*1.8)spawn();
const lim=by-Math.max(H,W)*1.2;
let n=0;
while(n<obs.length&&obs[n].y+obs[n].h<=lim)n++;
if(n)obs.splice(0,n);
}

function segDist(px,py,ax,ay,cx,cy){
const dx=cx-ax,dy=cy-ay;
let t=((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy);
t=Math.max(0,Math.min(1,t));
const qx=ax+dx*t-px,qy=ay+dy*t-py;
return Math.sqrt(qx*qx+qy*qy);
}
function rectHit(rx,ry,rw,rh){
const qx=Math.max(rx,Math.min(bx,rx+rw)),qy=Math.max(ry,Math.min(by,ry+rh));
const dx=bx-qx,dy=by-qy;
return dx*dx+dy*dy<(BR*0.85)*(BR*0.85);
}
function laserOn(o){return ((time+o.ph)%o.per)<o.on}
function gapX(o){return tw/2+Math.sin(time*o.sp+o.ph)*o.amp}
function barEnds(o,k){
const a=o.a0+o.sp*time+k*Math.PI/2;
const c=Math.cos(a)*o.len/2,s=Math.sin(a)*o.len/2;
BE[0]=o.cx-c;BE[1]=o.cy-s;BE[2]=o.cx+c;BE[3]=o.cy+s;return BE;
}
function orbPos(o){return o.cx+Math.sin(time*o.sp+o.ph)*o.amp}

function rectDist(rx,ry,rw,rh){
const qx=Math.max(rx,Math.min(bx,rx+rw)),qy=Math.max(ry,Math.min(by,ry+rh));
return Math.hypot(bx-qx,by-qy);
}
function clearance(o){
if(o.t==='wall'){
const gx=gapX(o);
return Math.min(rectDist(0,o.y,gx-o.gw/2,o.th),rectDist(gx+o.gw/2,o.y,tw-gx-o.gw/2,o.th))-BR;
}
if(o.t==='bar'){
let m=Infinity;
for(let k=0;k<(o.cross?2:1);k++){
const e=barEnds(o,k);
m=Math.min(m,segDist(bx,by,e[0],e[1],e[2],e[3]));
}
return m-BR;
}
if(o.t==='laser'){
if(!laserOn(o))return Infinity;
const x0=o.side===0?0:tw-o.len;
return rectDist(x0,o.y-3,o.len,6)-BR;
}
return Math.hypot(bx-orbPos(o),by-o.y)-(BR+o.r);
}

function hits(){
for(const o of obs){
if(Math.abs(by-o.y)>o.h+200)continue;
if(o.t==='wall'){
const gx=gapX(o);
if(rectHit(0,o.y,gx-o.gw/2,o.th)||rectHit(gx+o.gw/2,o.y,tw-gx-o.gw/2,o.th))return true;
}else if(o.t==='bar'){
for(let k=0;k<(o.cross?2:1);k++){
const e=barEnds(o,k);
if(segDist(bx,by,e[0],e[1],e[2],e[3])<BR+1)return true;
}
}else if(o.t==='laser'){
if(laserOn(o)){
const x0=o.side===0?0:tw-o.len;
if(rectHit(x0,o.y-3,o.len,6))return true;
}
}else{
const dx=bx-orbPos(o),dy=by-o.y;
if(dx*dx+dy*dy<(BR+o.r)*(BR+o.r))return true;
}
}
return false;
}

let streak=0,startBest=0,hsShown=false,score=0;
function showPop(txt,big){
const el=$('pop');
el.textContent=txt;
el.className='';
void el.offsetWidth;
el.className=big?'show big':'show';
}
function cheer(crazy){
if(state!=='play')return;
streak++;
if(streak%5===0)showPop(streak+' in a Row',true);
else showPop(crazy?'Crazy 😱':'Perfect',crazy);
if(streak%5===0)sfxStreak();else if(crazy)sfxCrazy();else sfxPerfect(streak);
}
function die(){
state='dead';
for(let i=0;i<60;i++){
const a=rnd(0,6.28),s=rnd(40,320);
parts.push({x:bx,y:by,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:'hsl('+rnd(330,390)+',100%,65%)'});
}
shake=16;
stopMusic();sfxCrash();
try{navigator.vibrate&&navigator.vibrate([30,40,90])}catch(e){}
const sc=score;
const rec=startBest>0&&sc>startBest;
if(sc>best){best=sc;try{localStorage.setItem('ns_best2',best)}catch(e){}}
$('bs').textContent=best;
$('ot').textContent=rec?'High Score':'Game Over';
$('mc').className=rec?'win':'mock';
$('pop').className='';
$('od').textContent='Score '+sc+' · Best '+best;
gameOverCount++;
setTimeout(()=>{$('ov').style.display='flex'},650);
setTimeout(rec?sfxWin:sfxLose,rec?500:450);
}

let dragging=false,startX=0;
addEventListener('pointerdown',e=>{
initAudio();
if(ac&&ac.state==='suspended')ac.resume();
if(e.target.closest('button')){if(e.target.id!=='mt')sfxClick();return}
dragging=true;startX=e.clientX;
if(state==='ready'){state='play';target=0;gateGo=true;$('hint').style.display='none';sfxStart();startMusic()}
});
addEventListener('pointermove',e=>{
if(!dragging||state!=='play')return;
const k=(startX-e.clientX)/(Math.min(W,520)*0.24);
target=Math.max(-1.25,Math.min(1.25,k*1.1));
});
function release(){dragging=false;target=0}
addEventListener('pointerup',release);
addEventListener('pointercancel',release);

let last=performance.now(),idleDrawn=false;
function frame(now){
const dt=Math.min((now-last)/1000,0.04);
last=now;
step(dt);
if(state==='dead'&&parts.length===0&&shake<0.3){
if(!idleDrawn){draw();idleDrawn=true}
}else{
idleDrawn=false;
draw();
}
requestAnimationFrame(frame);
}

function demoV(ms){
const p=(ms/3600)%1;
const e=t=>t*t*(3-2*t);
if(p<0.08)return -1;
if(p<0.46)return -1+2*e((p-0.08)/0.38);
if(p<0.58)return 1;
if(p<0.96)return 1-2*e((p-0.58)/0.38);
return -1;
}

function step(dt){
if(gateGo&&gateOpen<1)gateOpen=Math.min(1,gateOpen+dt/0.3);
theta+=(target-theta)*Math.min(1,dt*14);
if(state==='play'){
time+=dt;
const speed=190+Math.min(by*0.01,150);
const drag=2;
const G=speed*drag;
const ax=G*3.6*Math.sin(theta)-drag*2.2*vx;
const ay=G*Math.cos(theta)-drag*vy;
vx+=ax*dt;vy+=ay*dt;
if(gateOpen<1)vx=(tw/2-bx)*10;
bx+=vx*dt;by+=vy*dt;
if(bx<BR){bx=BR;vx=Math.max(vx,0)}
if(bx>tw-BR){bx=tw-BR;vx=Math.min(vx,0)}
tqx[th]=bx;tqy[th]=by;th=(th+1)%TL;if(tn<TL)tn++;
fill();
const cur=score;
if(cur!==lastSc){lastSc=cur;$('sc').textContent=cur}
if(!hsShown&&startBest>0&&cur>startBest){hsShown=true;showPop('High Score',true);sfxChime()}
for(const o of obs){
if(Math.abs(by-o.y)<o.h+200){
const c=clearance(o);
if(c<(o.near===undefined?Infinity:o.near))o.near=c;
}
if(!o.done&&by>o.y+o.h+BR){
o.done=true;
if(o.t!=='orb'||o.last){
let nr=o.near===undefined?Infinity:o.near;
if(o.t==='orb'){for(const q of obs){if(q.t==='orb'&&q.gid===o.gid&&q.near<nr)nr=q.near}}
score++;cheer(nr<18);
}
}
}
if(hits())die();
}else if(state==='ready'){
time+=dt*0.3;
const v=demoV(performance.now());
target=-v*0.45;
const gs=190,gd=2,gg=gs*gd;
const bt=tw/2-v*(tw/4);
vx=(bt-bx)*7;
vy+=(gg*Math.cos(theta)-gd*vy)*dt;
bx+=vx*dt;by+=vy*dt;
if(bx<BR){bx=BR;vx=Math.max(vx,0)}
if(bx>tw-BR){bx=tw-BR;vx=Math.min(vx,0)}
if(by>=BARY-BR){by=BARY-BR;vy=vy>70?-vy*0.22:0}
fgEl.style.transform='translateX('+(v*84)+'px)';
}
for(let i=parts.length-1;i>=0;i--){
const p=parts[i];
p.x+=p.vx*dt;p.y+=p.vy*dt;
p.vx*=0.98;p.vy*=0.98;
p.l-=dt*1.1;
if(p.l<=0)parts.splice(i,1);
}
shake*=0.9;
}

function glow(c,b){g.shadowColor=c;g.shadowBlur=b;g.strokeStyle=c;g.fillStyle=c}

function rr(x,y,w,h,r){
g.beginPath();
g.moveTo(x+r,y);
g.arcTo(x+w,y,x+w,y+h,r);
g.arcTo(x+w,y+h,x,y+h,r);
g.arcTo(x,y+h,x,y,r);
g.arcTo(x,y,x+w,y,r);
g.closePath();
}

function barPath(o){
g.beginPath();
for(let k=0;k<(o.cross?2:1);k++){
const e=barEnds(o,k);
g.moveTo(e[0],e[1]);
g.lineTo(e[2],e[3]);
}
g.stroke();
}

const CRACKS=[[0.18,3,4,-2,8,2,11,-1,14],[0.36,-2,3,3,6,-1,10,2,14],[0.55,-3,3,2,7,-2,10,3,14],[0.74,2,5,-3,9,1,14],[0.9,-2,4,2,9,0,14]];

function crackPass(c,hw,ox,oy,col,w){
c.strokeStyle=col;
c.lineWidth=w;
for(const k of CRACKS){
c.beginPath();
c.moveTo(k[0]*hw+ox,oy);
for(let i=1;i<k.length;i+=2)c.lineTo(k[0]*hw+k[i]+ox,k[i+1]+oy);
c.stroke();
}
}

function buildGate(){
const hw=tw/2-1;
gateSpr=document.createElement('canvas');
gateSpr.width=Math.ceil((hw+GM*2)*dpr);
gateSpr.height=Math.ceil((GTH+GM*2)*dpr);
const c=gateSpr.getContext('2d');
c.scale(dpr,dpr);
c.translate(GM,GM);
c.fillStyle='rgba(125,211,252,.1)';
c.fillRect(-5,-4,hw+10,GTH+8);
c.fillStyle='rgba(125,211,252,.18)';
c.fillRect(-2,-2,hw+4,GTH+4);
const gr=c.createLinearGradient(0,0,0,GTH);
gr.addColorStop(0,'#d6f1ff');
gr.addColorStop(0.35,'#6fb6ec');
gr.addColorStop(1,'#2a4f8f');
c.fillStyle=gr;
c.beginPath();
c.moveTo(5,0);
c.lineTo(hw,0);
c.lineTo(hw-3,GTH*0.28);
c.lineTo(hw+1,GTH*0.52);
c.lineTo(hw-4,GTH*0.76);
c.lineTo(hw,GTH);
c.lineTo(5,GTH);
c.arcTo(0,GTH,0,GTH-5,5);
c.lineTo(0,5);
c.arcTo(0,0,5,0,5);
c.closePath();
c.fill();
c.fillStyle='rgba(255,255,255,.7)';
c.fillRect(6,1.5,hw-12,1.5);
c.lineCap='round';
c.lineJoin='round';
crackPass(c,hw,0,0,'rgba(125,211,252,.45)',3.2);
crackPass(c,hw,1,0,'rgba(210,238,255,.55)',1);
crackPass(c,hw,0,0,'rgba(8,18,45,.92)',1.3);
}

function drawGate(){
if(!gateSpr)buildGate();
const a=1.45*gateOpen*gateOpen;
const hw=tw/2-1;
for(let q=0;q<2;q++){
g.save();
g.translate(q===0?0:tw,BARY);
g.rotate(q===0?a:-a);
if(q===1)g.scale(-1,1);
g.drawImage(gateSpr,-GM,-GM,hw+GM*2,GTH+GM*2);
g.restore();
}
}

function draw(){
const R=visR;
g.save();
if(shake>0.3)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
g.translate(W/2,H*0.38);
g.rotate(theta);
g.translate(-tw/2,-by);
g.fillStyle='#0a0c24';
g.fillRect(-R,by-R,tw+R*2,R*2);
g.fillStyle='#191d4a';
g.fillRect(0,by-R,tw,R*2);
g.beginPath();
g.moveTo(0,by-R);g.lineTo(0,by+R);
g.moveTo(tw,by-R);g.lineTo(tw,by+R);
g.strokeStyle='rgba(125,211,252,.2)';
g.lineWidth=10;
g.stroke();
g.strokeStyle='#7dd3fc';
g.lineWidth=3;
g.stroke();
if(by<R+300)drawGate();
for(const o of obs){
if(Math.abs(o.y-by)>R+200)continue;
if(o.t==='wall'){
const gx=gapX(o);
const lw=gx-o.gw/2,rx=gx+o.gw/2;
g.fillStyle='rgba(255,107,138,.2)';
g.fillRect(0,o.y-6,lw,o.th+12);
g.fillRect(rx,o.y-6,tw-rx,o.th+12);
g.fillStyle='#ff6b8a';
g.fillRect(0,o.y,lw,o.th);
g.fillRect(rx,o.y,tw-rx,o.th);
}else if(o.t==='bar'){
g.lineCap='round';
g.strokeStyle='rgba(167,139,250,.22)';
g.lineWidth=18;
barPath(o);
g.strokeStyle='#a78bfa';
g.lineWidth=8;
barPath(o);
g.fillStyle='#a78bfa';
g.beginPath();g.arc(o.cx,o.cy,6,0,7);g.fill();
}else if(o.t==='laser'){
const x0=o.side===0?0:tw-o.len;
const ph=(time+o.ph)%o.per;
if(ph<o.on){
g.fillStyle='rgba(251,191,36,.25)';
g.fillRect(x0,o.y-8,o.len,16);
g.fillStyle='#fbbf24';
g.fillRect(x0,o.y-3,o.len,6);
}else{
const warn=o.per-ph<0.5;
g.shadowBlur=0;
g.fillStyle=warn?'rgba(251,191,36,0.55)':'rgba(251,191,36,0.14)';
g.fillRect(x0,o.y-1,o.len,2);
}
g.fillStyle='#fbbf24';
g.shadowBlur=0;
g.fillRect(o.side===0?0:tw-6,o.y-7,6,14);
}else{
const ox=orbPos(o);
g.fillStyle='rgba(52,211,153,.22)';
g.beginPath();g.arc(ox,o.y,o.r+6,0,7);g.fill();
g.fillStyle='#34d399';
g.beginPath();g.arc(ox,o.y,o.r,0,7);g.fill();
}
}
for(let i=0;i<tn;i++){
const j=i+TL-tn;
const idx=(th-tn+i+TL)%TL;
g.fillStyle=TRC[j];
g.beginPath();g.arc(tqx[idx],tqy[idx],BR*(j/TL)*0.9,0,7);g.fill();
}
for(const p of parts){
g.fillStyle=p.c;
g.globalAlpha=Math.max(p.l,0);
g.fillRect(p.x,p.y,3,3);
}
g.globalAlpha=1;
if(state!=='dead'){
g.drawImage(gsp,bx-32,by-32,64,64);
g.fillStyle='#7dd3fc';
g.beginPath();g.arc(bx,by,BR,0,7);g.fill();
g.fillStyle='#ffffff';
g.beginPath();g.arc(bx,by,BR*0.45,0,7);g.fill();
}
g.restore();
}

reset();
requestAnimationFrame(frame);
const INTERSTITIAL_AFTER_GAME_OVERS=4;
let gameOverCount=0,interstitialPending=false,obLabelBackup='';
const obBtn=$('ob');
function setInterstitialBusy(){
interstitialPending=true;
obLabelBackup=obBtn.textContent;
obBtn.style.minWidth=obBtn.offsetWidth+'px';
obBtn.classList.add('ad-loading');
obBtn.textContent='Loading Ad...';
obBtn.disabled=true;
}
function clearInterstitialBusy(){
interstitialPending=false;
obBtn.classList.remove('ad-loading');
obBtn.style.minWidth='';
obBtn.textContent=obLabelBackup;
obBtn.disabled=false;
}
function requestInterstitialAd(){
setInterstitialBusy();
try{
window.AndroidAds.showInterstitialAd();
}catch(err){
clearInterstitialBusy();
if(state==='dead')reset();
}
}
window.onInterstitialAdResult=function(result){
if(!interstitialPending)return;
clearInterstitialBusy();
if(result==='shown'){
gameOverCount=0;
}else if(state==='dead'){
reset();
}
};
obBtn.onclick=function(e){
e.stopPropagation();
if(interstitialPending)return;
if(gameOverCount>=INTERSTITIAL_AFTER_GAME_OVERS&&window.AndroidAds&&window.AndroidAds.showInterstitialAd){
requestInterstitialAd();
return;
}
reset();
};
